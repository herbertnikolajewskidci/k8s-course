apiVersion: v1
kind: Pod
metadata:
  name: logger-pod
  namespace: troubleshoot-app
spec:
  containers:
    - name: web-frontend
      image: nginx:alpine
    - name: log-processor
      image: busybox:latest
      command:
        - sh
        - -c
        - "while true; do echo 'Processing logs...'; sleep 10; done"
